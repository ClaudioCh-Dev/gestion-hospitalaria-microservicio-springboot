server:
  port: 8081

  servlet:
    context-path: /medical-records

spring:

  application:
    name: medical-record-listener

  # MongoDB: en Boot 4 las propiedades de conexion son spring.mongodb.*
  # (spring.data.mongodb.uri se ignora). Se deja tambien la antigua por compatibilidad.
  mongodb:
    uri: ${MONGO_URI:mongodb://sa:sa@mongo-db:27017/medical_records?authSource=admin}
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://sa:sa@mongo-db:27017/medical_records?authSource=admin}
  
  profiles:
    default: default

  config:
    import: "optional:configserver:${CONFIG_SERVER_HOST:http://localhost:7777}"

  cloud:

    function:
      definition: appointmentStateProcessor;medicalRecordProcessor;medicalRecordReadyConsumer

    stream:

      kafka:
        binder:
          brokers: ${KAFKA_BROKER:kafka-hospital:29092}

        # Binder de Kafka Streams (KStream): NO hereda la config de kafka.binder
        streams:
          binder:
            brokers: ${KAFKA_BROKER:kafka-hospital:29092}
            functions:
              # Cada topología necesita su propio application.id
              # (si no, ambas usan spring.application.name y comparten
              # /tmp/kafka-streams/medical-record-listener -> lock conflict)
              appointmentStateProcessor:
                applicationId: medical-record-appointment-state
              medicalRecordProcessor:
                applicationId: medical-record-ready-processor

      bindings:
        appointmentStateProcessor-in-0:
          destination: appointment-created
          group: medical-record-appointment-created
          content-type: application/json

        appointmentStateProcessor-in-1:
          destination: appointment-updated-status
          group: medical-record-appointment-updated
          content-type: application/json

        appointmentStateProcessor-out-0:
          destination: appointment-state
          content-type: application/json

        medicalRecordProcessor-in-0:
          destination: appointment-state
          group: medical-record-processor
          content-type: application/json

        medicalRecordProcessor-in-1:
          destination: payment-update-status
          group: medical-record-payment
          content-type: application/json

        medicalRecordProcessor-out-0:
          destination: medical-record-ready
          content-type: application/json

        medicalRecordReadyConsumer-in-0:
          destination: medical-record-ready
          group: medical-record-ready
          content-type: application/json

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}

  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://ms-registry-server:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

scalar:
  enabled: false
  darkMode: true
  theme: deepSpace