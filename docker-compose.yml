  ms-registry-server:
    image: ms-hospital-registry:latest
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: ms-registry-server
    restart: always
    ports:
      - "8761:8761"

  ms-config-server:
    image: ms-hospital-config:latest
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: ms-config-server
    restart: always
    ports:
      - "7777:7777"
    depends_on:
      - ms-registry-server
    environment:
      SPRING_PROFILES_ACTIVE: prod   # <--- AGREGA ESTO
      EUREKA_SERVER_URL: http://ms-registry-server:8761/eureka
      CONFIG_GIT_URI: ${CONFIG_GIT_URI}
      CONFIG_GIT_USERNAME: ${CONFIG_GIT_USERNAME}
      CONFIG_GIT_TOKEN: ${CONFIG_GIT_TOKEN}
  ms-patient:
    image: ms-hospital-patient:latest
    build:
      context: ./patient-ms
      dockerfile: Dockerfile
    container_name: ms-patient
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - ms-config-server
      - ms-registry-server
      - db
      - kafka
#      - otel-collector
    environment:
      EUREKA_SERVER_URL: http://ms-registry-server:8761/eureka
      CONFIG_SERVER_HOST: http://ms-config-server:7777
      KAFKA_BROKER: kafka-hospital:29092
      OTLP_TRACING_URL: http://otel-collector:4318/v1/traces
      OTLP_LOGGING_URL: http://otel-collector:4318/v1/logs
      OTLP_METRICS_URL: http://otel-collector:4318/v1/metrics
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: always
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hospital-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-hospital:29092
  ms-gateway:
    image: ms-gateway:latest
    container_name: ms-gateway
    restart: always
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "4040:4040"
    depends_on:
      - ms-registry-server
    environment:
      EUREKA_SERVER_URL: http://ms-registry-server:8761/eureka
      AUTH_VALIDATE_URI: http://ms-auth-server:3000/auth-server/auth/jwt
  auth-server:
    image: ms-auth-server:latest
    build:
      context: ./auth-server
      dockerfile: Dockerfile
    container_name: auth-server
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - ms-registry-server
    environment:
      EUREKA_SERVER_URL: http://ms-registry-server:8761/eureka
      CONFIG_SERVER_HOST: http://ms-config-server:7777