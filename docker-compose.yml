version: '3.8'

services:

  # =================== INFRAESTRUCTURA ===================

  db:
    image: postgres:16.1
    container_name: db-hospital
    restart: always
    volumes:
      - ./sql/create-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    environment:
      POSTGRES_DB: hospital_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '123456'
    ports:
      - '5434:5432'

#  mongo-db:
#    image: mongo:7.0.5-rc0
#    container_name: mongo-hospital
#    restart: always
#    environment:
#      MONGO_INITDB_ROOT_USERNAME: sa
#      MONGO_INITDB_ROOT_PASSWORD: sa
#      MONGO_INITDB_DATABASE: medical_records
#    ports:
#      - '27017:27017'

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.3
    container_name: zookeeper-hospital
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'

  kafka:
    image: confluentinc/cp-kafka:7.4.3
    container_name: kafka-hospital
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-hospital:9092,PLAINTEXT_INTERNAL://kafka-hospital:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - '9092:9092'

