version: '3.8'

services:

  # =================== INFRAESTRUCTURA ===================

  db:
    image: postgres:16.1
    container_name: db-hospital
    restart: always
    volumes:
      - ./sql/create-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    environment:
      POSTGRES_DB: hospital_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '123456'
    ports:
      - '5434:5432'

#  mongo-db:
#    image: mongo:7.0.5-rc0
#    container_name: mongo-hospital
#    restart: always
#    environment:
#      MONGO_INITDB_ROOT_USERNAME: sa
#      MONGO_INITDB_ROOT_PASSWORD: sa
#      MONGO_INITDB_DATABASE: medical_records
#    ports:
#      - '27017:27017'

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.3
    container_name: zookeeper-hospital
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'

  kafka:
    image: confluentinc/cp-kafka:7.4.3
    container_name: kafka-hospital
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-hospital:9092,PLAINTEXT_INTERNAL://kafka-hospital:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - '9092:9092'

  # =================== OBSERVABILIDAD ===================
  # (idéntico a tu proyecto de referencia)

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.82.0
    restart: always
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/otel-collector.yml"]
    volumes:
      - ./metric_files/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./metric_files/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./metric_files/tempo.yml:/etc/tempo.yml
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  grafana:
    container_name: grafana 
    image: grafana/grafana
    volumes:
      - ./metric_files/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    ports:
      - "3001:3000"

  ms-registry-server:
    image: ms-hospital-registry:latest
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: ms-registry-server
    restart: always
    ports:
      - "8761:8761"

  ms-config-server:
    image: ms-hospital-config:latest
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: ms-config-server
    restart: always
    ports:
      - "7777:7777"
    depends_on:
      - ms-registry-server
    environment:
      SPRING_PROFILES_ACTIVE: prod   # <--- AGREGA ESTO
      EUREKA_SERVER_URL: http://ms-registry-server:8761/eureka
      CONFIG_GIT_URI: ${CONFIG_GIT_URI}
      CONFIG_GIT_USERNAME: ${CONFIG_GIT_USERNAME}
      CONFIG_GIT_TOKEN: ${CONFIG_GIT_TOKEN}
  ms-patient:
    image: ms-hospital-patient:latest
    build:
      context: .
      dockerfile: patient-ms/Dockerfile
    container_name: ms-patient
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - ms-config-server
      - ms-registry-server
      - db
      - kafka
      - otel-collector
    environment:
      EUREKA_SERVER_URL: http://ms-registry-server:8761/eureka
      CONFIG_SERVER_HOST: http://ms-config-server:7777
      KAFKA_BROKER: kafka-hospital:29092
      # OpenTelemetry
      OTEL_SERVICE_NAME: patient-ms
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp

      
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: always
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hospital-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-hospital:29092
  ms-gateway:
    image: ms-gateway:latest
    container_name: ms-gateway
    restart: always
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "4040:4040"
    depends_on:
      - ms-registry-server
      - otel-collector
    environment:
      EUREKA_SERVER_URL: http://ms-registry-server:8761/eureka
      AUTH_VALIDATE_URI: http://auth-server:3000/auth-server/auth/validate-jwt
      # OpenTelemetry
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
  auth-server:
    image: ms-auth-server:latest
    build:
      context: .
      dockerfile: auth-server/Dockerfile
    container_name: auth-server
    restart: always

    ports:
      - "3000:3000"

    depends_on:
      - ms-registry-server
      - ms-config-server
      - otel-collector

    environment:
      EUREKA_SERVER_URL: http://ms-registry-server:8761/eureka
      CONFIG_SERVER_HOST: http://ms-config-server:7777
      # OpenTelemetry
      OTEL_SERVICE_NAME: auth-server
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp

  ms-doctor:
    image: ms-hospital-doctor:latest
    build:
      context: .
      dockerfile: doctor-ms/Dockerfile
    container_name: ms-doctor
    restart: always
    ports:
      - "8082:8081"
    depends_on:
      - ms-config-server
      - ms-registry-server
      - db
      - kafka
      - otel-collector
    environment:
      EUREKA_SERVER_URL: http://ms-registry-server:8761/eureka
      CONFIG_SERVER_HOST: http://ms-config-server:7777
      KAFKA_BROKER: kafka-hospital:29092
      # OpenTelemetry
      OTEL_SERVICE_NAME: doctor-ms
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp

  ms-appointment:
    image: ms-hospital-appointment:latest
    build:
      context: .
      dockerfile: appointment-ms/Dockerfile
    container_name: ms-appointment
    restart: always
    ports:
      - "8083:8081"
    depends_on:
      - ms-config-server
      - ms-registry-server
      - db
      - kafka
      - otel-collector
    environment:
      EUREKA_SERVER_URL: http://ms-registry-server:8761/eureka
      CONFIG_SERVER_HOST: http://ms-config-server:7777
      KAFKA_BROKER: kafka-hospital:29092
      # OpenTelemetry
      OTEL_SERVICE_NAME: appointment-ms
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp


  ms-billing:
    image: ms-hospital-billing:latest
    build:
      context: .
      dockerfile: billing-ms/Dockerfile
    container_name: ms-billing
    restart: always
    ports:
      - "8084:8081"
    depends_on:
      - ms-config-server
      - ms-registry-server
      - db
      - kafka
      - otel-collector
    environment:
      EUREKA_SERVER_URL: http://ms-registry-server:8761/eureka
      CONFIG_SERVER_HOST: http://ms-config-server:7777
      KAFKA_BROKER: kafka-hospital:29092
      # OpenTelemetry
      OTEL_SERVICE_NAME: billing-ms
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_LOGS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp