spring:
  application:
    name: doctor-ms

  profiles:
    default: prod

  config:
    import: "optional:configserver:${CONFIG_SERVER_HOST:http://localhost:7777}"

  cloud:
    stream:
      # Crea los bindings de StreamBridge al ARRANCAR (no en el primer send)
      output-bindings: doctor-created;doctor-updated

      kafka:
        binder:
          brokers: ${KAFKA_BROKER:kafka-hospital:29092}

      bindings:
        doctor-created-out-0:
          destination: doctor-created
          content-type: application/json
        doctor-updated-out-0:
          destination: doctor-updated
          content-type: application/json

    openfeign:
      circuitbreaker:
        enabled: true

  datasource:
    username: ${db.username:postgres}
    password: ${db.password:123456}
    url: ${db.url:jdbc:postgresql://localhost:5434/hospital_db}
    hikari:
      connection-timeout: ${db.connection-timeout:30000}
      maximum-pool-size: ${db.maximum-pool-size:10}

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 4s

    instances:
      auth-server:
        baseConfig: default

  circuitbreaker:

    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

    instances:

      auth-server:
        baseConfig: default
        ignoreExceptions:
          - personal.shared.exception.BusinessException
          - feign.FeignException.BadRequest
          - feign.FeignException.NotFound
          - feign.FeignException.UnprocessableEntity

server:
  port: 8081
  servlet:
    context-path: /doctors


eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}

  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://ms-registry-server:8761/eureka}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics


scalar:
  enabled: false
  darkMode: true
  theme: deepSpace