spring:
  application:
    name: billing-ms

  profiles:
    default: prod

  config:
    import: "optional:configserver:${CONFIG_SERVER_HOST:http://localhost:7777}"

  cloud:
    function:
      # Deben coincidir con los @Bean de listeners/AppointmentListener.java
      definition: appointmentCreatedConsumer;appointmentUpdatedStatusConsumer;appointmentCreatedTypeConsumer

    stream:
      # OJO: no usar "output-bindings" aquí. Junto con function.definition, Spring
      # Cloud Stream trata el canal como un Supplier y lanza ClassCastException en
      # el poller. StreamBridge crea el binding "paymentUpdateStatusProducer-out-0"
      # en el primer send, usando la config de "bindings" de abajo.

      kafka:
        binder:
          brokers: ${KAFKA_BROKER:kafka-hospital:29092}
          configuration:
            "[enable.auto.commit]": false

      bindings:
        appointmentCreatedConsumer-in-0:
          destination: appointment-created
          group: billing-ms
          content-type: application/json
          consumer:
            max-attempts: 3

        appointmentUpdatedStatusConsumer-in-0:
          destination: appointment-updated-status
          group: billing-ms
          content-type: application/json
          consumer:
            max-attempts: 3

        appointmentCreatedTypeConsumer-in-0:
          destination: appointment-created-type
          group: billing-ms
          content-type: application/json
          consumer:
            max-attempts: 3

        paymentUpdateStatusProducer-out-0:
          destination: payment-update-status
          content-type: application/json

    openfeign:
      circuitbreaker:
        enabled: true

  datasource:
    username: ${db.username:postgres}
    password: ${db.password:123456}
    url: ${db.url:jdbc:postgresql://localhost:5434/hospital_db}
    hikari:
      connection-timeout: ${db.connection-timeout:30000}
      maximum-pool-size: ${db.maximum-pool-size:10}

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 4s

    instances:
      appointment-ms:
        baseConfig: default

  circuitbreaker:

    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2

    instances:

      appointment-ms:
        baseConfig: default
        ignoreExceptions:
          - personal.shared.exception.BusinessException
          - feign.FeignException.BadRequest
          - feign.FeignException.NotFound
          - feign.FeignException.UnprocessableEntity

server:
  port: 8081
  servlet:
    context-path: /billings

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}

  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://ms-registry-server:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

scalar:
  enabled: false
  darkMode: true
  theme: deepSpace