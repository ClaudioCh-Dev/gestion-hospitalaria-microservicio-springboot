spring:
  application:
    name: patient-ms

  profiles:
    default: prod

  config:
    import: "optional:configserver:${CONFIG_SERVER_HOST:http://localhost:7777}"

  cloud:
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKER:kafka-hospital:29092}

      bindings:
        patient-created-out-0:
          destination: patient-created
          content-type: application/json


  datasource:
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    url: ${DB_URL:jdbc:postgresql://db:5432/hospital_db}

    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}


server:
  servlet:
    context-path: /patient

  port: 8081


eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}

  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://ms-registry-server:8761/eureka}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics


scalar:
  darkMode: true
  theme: deepSpace