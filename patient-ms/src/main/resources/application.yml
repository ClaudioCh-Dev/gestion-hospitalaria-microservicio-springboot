spring:
  application:
    name: patient-ms

  profiles:
    default: prod

  config:
    import: "optional:configserver:${CONFIG_SERVER_HOST:http://localhost:7777}"

  cloud:
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKER:kafka-hospital:29092}

      bindings:
        patient-created-out-0:
          destination: patient-created
          content-type: application/json
        patient-updated-out-0:
          destination: patient-updated
          content-type: application/json


  datasource:
    username: ${db.username:postgres}
    password: ${db.password:123456}
    url: ${db.url:jdbc:postgresql://localhost:5434/hospital_db}
    hikari:
      connection-timeout: ${db.connection-timeout:30000}
      maximum-pool-size: ${db.maximum-pool-size:10}

server:
  port: 8081
  servlet:
    context-path: /patients

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}

  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://ms-registry-server:8761/eureka}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics


scalar:
  enabled: false
  darkMode: true
  theme: deepSpace