spring:
  application:
    name: patient-ms

  profiles:
    default: prod

  config:
    import: "optional:configserver:${CONFIG_SERVER_HOST:http://localhost:7777}"

  cloud:
    stream:
      binder:
        brokers: ${KAFKA_BROKER:localhost:9092}

      function:
        definition: createPatient

      bindings:
        patient-created-out-0:
          destination: patient-created


  datasource:
    username: ${db.username:postgres}
    password: ${db.password:123456}
    url: ${db.url:jdbc:postgresql://localhost:5436/companies}
    hikari:
      connection-timeout: ${db.connection-timeout:30000}
      maximum-pool-size: ${db.maximum-pool-size:10}


server:
  servlet:
    context-path: /patient
  port: 8081

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}

  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

scalar:
  darkMode: true
  theme: deepSpace